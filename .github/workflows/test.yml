name: tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Chrome version (for the CDP smoke test)
        run: |
          google-chrome --version || chromium --version || echo "no chrome on PATH"

      - name: Run schema and smoke tests
        run: node --test --test-reporter=spec "test/*.test.mjs"
